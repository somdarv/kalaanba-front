key: player.positions.labels
engine: player-affiliation
scope: platform
value_type: json
default: '{"goalkeeper":"Goalkeeper","left_back":"Left Back","centre_back":"Centre Back","right_back":"Right Back","defensive_midfielder":"Defensive Midfielder","left_midfielder":"Left Midfielder","centre_midfielder":"Centre Midfielder","right_midfielder":"Right Midfielder","attacking_midfielder":"Attacking Midfielder","left_winger":"Left Winger","right_winger":"Right Winger","second_striker":"Second Striker","striker":"Striker","defender":"Defender","midfielder":"Midfielder","forward":"Forward"}'
approval_level: low
description: |
  Display labels for the primary-position keys in `player.positions`
  (Player & Affiliation engine doc §6). Internal keys are stable and carry all
  logic; these strings are cosmetic and translatable (Constitution Law 4), which
  is why the approval level is low.

  Served to clients through `GET /api/v1/players/meta` (ADR-0007) and resolved
  against `Accept-Language`. A key present in `player.positions` but absent here
  falls back to the raw key rather than rendering blank — a missing label must
  never produce an unselectable option.

  Order is NOT taken from this map. Presentation order follows `player.positions`.

  Locale variants: a suffixed key (`<this key>.<language tag>`, e.g.
  `player.positions.labels.fr`) overrides this map for that language.
  Resolution narrows from the full tag to the bare language to this key —
  `fr-FR` tries `.fr-fr`, then `.fr`, then this one — so a region needs its
  own map only where it actually differs.

  Retired keys (`defender`, `midfielder`, `forward`) stay in this map after
  2026-08-19 even though they were removed from `player.positions`. They are no
  longer offerable, but players who chose one before the expansion still have it
  stored, and a label map is a lookup rather than an option set. Removing them
  would make an existing profile render its raw internal key. Deprecate, don't
  delete (engineering-standards §7).
