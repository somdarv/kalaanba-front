key: player.card.featured_stats
engine: player-affiliation
scope: platform
value_type: json
default: >-
  {
    "goalkeeper":            ["appearances","clean_sheets","minutes"],
    "left_back":             ["appearances","clean_sheets","assists"],
    "centre_back":           ["appearances","clean_sheets","goals"],
    "right_back":            ["appearances","clean_sheets","assists"],
    "defensive_midfielder":  ["appearances","clean_sheets","assists"],
    "left_midfielder":       ["appearances","assists","goals"],
    "centre_midfielder":     ["appearances","assists","goals"],
    "right_midfielder":      ["appearances","assists","goals"],
    "attacking_midfielder":  ["appearances","goals","assists"],
    "left_winger":           ["appearances","goals","assists"],
    "right_winger":          ["appearances","goals","assists"],
    "second_striker":        ["appearances","goals","assists"],
    "striker":               ["appearances","goals","assists"]
  }
approval_level: medium
description: |
  The three verified counters the player card LEADS with, per primary-position
  key. Everything else the record holds still appears on the card, in the
  secondary strip underneath — this key decides billing, never visibility.

  Why this is configuration and not code (Constitution Law 2): a centre-back is
  not judged on goals and a goalkeeper is not judged on assists, so one fixed
  trio misrepresents most of the pitch. Which counters matter per position is
  also a football-culture judgement that will be argued about and revised, and
  revising it must not need a frontend deploy.

  Keys on both sides are stable internal keys (Law 4). Position keys must be
  members of `player.positions`. Stat keys must be fields of the VerifiedRecord
  shape in `contracts/api/player/get-players-me.v1.yaml`: appearances, starts,
  goals, assists, minutes, clean_sheets. `yellow_cards` and `red_cards` are
  deliberately NOT featurable — they are reported together as a single
  disciplinary line, and a card that leads with a player's bookings is not a
  card anyone shares.

  Every list must hold exactly three keys. The card's lead row is a three-up
  grid; two leaves a hole and four wraps on a 360px screen.

  `appearances` leads every position on purpose. It is the denominator for
  everything beside it, and a goals figure with no games played beside it is
  the kind of number that starts arguments at the side of a pitch.

  Defenders lead with clean sheets per the engine doc's own framing (§13 lists
  clean sheets among the verified set). Centre-backs keep `goals` in third
  because set-piece goals are how a centre-back gets talked about; full-backs
  keep `assists` for the same reason.

  Medium approval: it changes what every player card in the country leads with,
  but it invents no football and gates nothing downstream.
