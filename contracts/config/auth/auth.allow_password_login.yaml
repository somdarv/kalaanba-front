key: auth.allow_password_login
engine: admin-governance
scope: platform
value_type: boolean
default: "true"
approval_level: critical
description: |
  Whether the bootstrap email + password endpoint (POST /api/v1/auth/sessions
  from WP-A) is enabled. Will be flipped to false once OTP is the only
  supported login path for general users; bootstrap admins retain it via a
  scoped override. Critical because flipping it locks every user out of
  password-based access until OTP is fully provisioned.
