openapi: 3.1.0
info:
  title: "Admin — Approve Zone Area Suggestion"
  version: "1.0.0"
  description: |
    Approves a pending Zone area-suggestion, creating a verified `areas` row
    bound to the suggestion's target zone, and emits the
    `zone.area_approved` outbox event (Constitution Law 6).

    Idempotent: the same `Idempotency-Key` returns the existing approval
    result; re-approving an already-approved suggestion is a no-op.
    Super Admin only — denial returns `auth.super_admin_only` (403).

paths:
  /api/v1/admin/zone/area-suggestions/{id}/approve:
    post:
      summary: Approve a Zone area suggestion
      operationId: approveAdminZoneAreaSuggestion
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 64 }
        - in: header
          name: X-Request-Id
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                final_name:
                  type: string
                  description: |
                    Override the area name to use when creating the
                    `areas` row. Defaults to the suggestion's
                    `proposed_name`.
                review_note:
                  type: string
                  description: Optional moderator note (audited).
                zone_id:
                  type: string
                  format: uuid
                  description: |
                    Required ONLY when the suggestion has no
                    `proposed_zone_id`. Otherwise ignored.
      responses:
        "200":
          description: Approved (or already-approved idempotent reply)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, status, reviewed_at]
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string, enum: [approved] }
                      resulting_area_id: { type: ["string", "null"], format: uuid }
                      reviewed_by_user_id: { type: string }
                      reviewed_at: { type: string, format: date-time }
                      review_note: { type: ["string", "null"] }
        "400":
          description: |
            Missing `Idempotency-Key` header. Error code:
            `auth.idempotency_key_required`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { description: Unauthenticated }
        "403":
          description: Not Super Admin (`auth.super_admin_only`).
        "404":
          description: |
            Suggestion not found or terminal-state conflict.
            Error code: `zone.suggestion_not_found`.
        "422":
          description: |
            Missing `zone_id` for unscoped suggestion, or target zone does
            not exist. Codes: `zone.zone_id_required`, `zone.zone_not_found`.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sanctum
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
            request_id: { type: string }
