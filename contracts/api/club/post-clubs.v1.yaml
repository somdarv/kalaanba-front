openapi: 3.1.0
info:
  title: "Club — Create a club"
  version: "1.1.0"
  description: |
    Creates a club and makes the caller its Owner (Club engine doc §5, §7).
    Informal V1 onboarding — minimal required fields. Location (City Hub + Area)
    is validated against the Zone engine.

    **`tier` decides what this endpoint does** (added 1.1.0, WP-20260823):

      - `amateur` creates a live club. It may NOT take a name matching
        `club.name.reserved_terms`; one that does is refused with
        `club.name_reserved`.
      - `professional` creates the club with `verification_state = pending`,
        hidden from discovery and from other users until an admin clears it
        against the document-based upgrade path (§10). It is the only tier that
        may claim a reserved name, and claiming one is what the review checks.

    Additive within v1: `tier` is required going forward, but a request omitting
    it is read as the first `club.tiers` entry (`amateur`), which is both the
    pre-1.1.0 behaviour and the safer of the two.

paths:
  /api/v1/clubs:
    post:
      summary: Create a club (creator becomes Owner)
      operationId: createClub
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
        - in: header
          name: X-Request-Id
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, tier, club_type, city_hub_id, area_id]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 120
                  description: |
                    Shape only. The authoritative bounds are
                    `club.profile.name_min_length` and `_max_length`, served by
                    `GET /api/v1/clubs/meta`; these literals are the column
                    ceiling, not the rule.
                tier:
                  type: string
                  description: |
                    Stable internal key from the `club.tiers` config set
                    (`amateur` | `professional`).
                club_type:
                  type: string
                  description: |
                    Stable internal key from the `club.types` config set. Must
                    belong to the submitted `tier` per the `club.types.tier`
                    map, or the request is refused with `club.type_wrong_tier`.
                city_hub_id: { type: string, format: uuid }
                area_id: { type: string, format: uuid }
                crest_url: { type: [string, "null"], format: uri, maxLength: 2048 }
      responses:
        "201":
          description: |
            Club created; caller is its Owner. A `amateur` club is live. An
            `professional` club is created with `verification_state = pending` and
            is not yet visible to anyone but its own admins.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "./get-clubs.v1.yaml#/components/schemas/ClubView" }
                  meta: { type: object }
        "401":
          description: Missing or invalid bearer token.
        "422":
          description: |
            Validation errors. Stable error keys:
              club.name_invalid
              club.name_reserved
              club.tier_unknown
              club.type_unknown
              club.type_wrong_tier
              club.city_hub_invalid
              club.area_invalid
              club.location_unknown

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SanctumPersonalAccessToken
