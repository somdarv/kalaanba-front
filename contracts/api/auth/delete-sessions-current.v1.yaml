openapi: 3.1.0
info:
  title: "Auth — Revoke Current Session"
  version: "1.0.0"

paths:
  /api/v1/auth/sessions/current:
    delete:
      summary: Revoke the bearer token used by the current request
      operationId: deleteCurrentSession
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: header
          name: X-Request-Id
          required: false
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Token revoked
        "401":
          description: Missing or invalid bearer token

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SanctumPersonalAccessToken
