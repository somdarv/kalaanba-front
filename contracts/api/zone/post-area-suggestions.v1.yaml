openapi: 3.1.0
info:
  title: "Zone — Suggest a missing Area"
  version: "1.0.0"
  description: |
    User-facing area suggestion. When a user cannot find their locality in the
    area picker, they propose it (Zone §5: "If the area is missing, the user
    suggests the area and admin maps it after review"). The suggestion enters
    the existing admin review queue (see contracts/api/admin/zone/) in
    `pending` status; an admin later approves (creating a verified area) or
    rejects (history preserved — Constitution Law 13).

    Distinct from the admin endpoints, which review suggestions. This is the
    submission side. Requires a bearer token (the submitter is recorded) and an
    Idempotency-Key (Constitution Law 14).

    Implemented by kalaanba-api WP-20260625a-zone-public-read.

paths:
  /api/v1/zone/area-suggestions:
    post:
      summary: Suggest a missing area inside a City Hub
      operationId: suggestZoneArea
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
        - in: header
          name: X-Request-Id
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [city_hub_id, proposed_name]
              properties:
                city_hub_id: { type: string, format: uuid }
                proposed_name:
                  type: string
                  minLength: 2
                  maxLength: 80
                  description: The locality the user wants added.
                note:
                  type: ["string", "null"]
                  maxLength: 280
                  description: Optional context to help the admin map it.
      responses:
        "201":
          description: Suggestion accepted into the review queue
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [id, status]
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string, enum: [pending] }
                  meta: { type: object }
        "401": { description: Unauthenticated }
        "422":
          description: Validation failure (unknown hub, name out of bounds).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sanctum
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
            request_id: { type: string }
