openapi: 3.1.0
info:
  title: "Identity — Bind Phone to Account"
  version: "1.0.0"
  description: |
    Adds a phone channel to an already-authenticated user (typically an
    email-only signup). Two-step flow:

      1. POST /api/v1/users/me/channels/phone  → starts the bind (sends OTP)
      2. POST /api/v1/users/me/channels/phone/confirm → completes the bind

    Both endpoints require auth:sanctum. The `confirm` step consumes the
    OTP via Identity's OtpService directly; the OTP cannot be replayed
    against POST /api/v1/auth/otp/verify to mint a second login token —
    the OTP record is marked consumed atomically.

    On success, the account stores `phone_e164_hash` + `phone_e164_last4`
    and emits `identity.user_channel_bound` (channel=phone).

    Engine doc: docs/engines/identity/Identity_Engine_System_Document.md §8.

paths:
  /api/v1/users/me/channels/phone:
    post:
      summary: Start binding a phone to the current user
      operationId: startPhoneBinding
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_e164]
              additionalProperties: false
              properties:
                phone_e164:
                  type: string
                  pattern: "^\\+[1-9]\\d{6,14}$"
                  maxLength: 16
      responses:
        "202":
          description: OTP dispatched (mock provider in dev/test).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [expires_at, masked_phone, otp_length]
                    properties:
                      expires_at: { type: string, format: date-time }
                      masked_phone: { type: string }
                      otp_length: { type: integer, minimum: 4, maximum: 10 }
        "409":
          description: |
            The current user already has a phone bound. Error code
            `identity.channel.phone_already_bound`. Use a separate
            "replace phone" flow (not in V1).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: |
            Error codes:
              - auth.phone_in_use (another active account holds this phone)
              - identity.channel.phone_invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/users/me/channels/phone/confirm:
    post:
      summary: Confirm the phone-binding OTP
      operationId: confirmPhoneBinding
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_e164, otp]
              additionalProperties: false
              properties:
                phone_e164:
                  type: string
                  pattern: "^\\+[1-9]\\d{6,14}$"
                  maxLength: 16
                otp:
                  type: string
                  pattern: "^[0-9]{4,10}$"
                  maxLength: 10
      responses:
        "200":
          description: Phone bound; updated user projection returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "422":
          description: |
            Error codes:
              - auth.otp_invalid / auth.otp_expired / auth.otp_attempts_exhausted / auth.otp_not_found
              - auth.phone_in_use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    MeResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, name, role, email_verified, phone_bound]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email, nullable: true }
            phone_e164_last4: { type: string, nullable: true, minLength: 4, maxLength: 4 }
            role: { type: string }
            email_verified: { type: boolean }
            phone_bound: { type: boolean }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
            request_id: { type: string }
