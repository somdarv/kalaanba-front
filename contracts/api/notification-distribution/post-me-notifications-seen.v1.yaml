openapi: 3.1.0
info:
  title: "Notification Inbox — Mark seen"
  version: "1.0.0"

paths:
  /api/v1/me/notifications/{id}/seen:
    post:
      summary: Mark an inbox item as seen by the authenticated user
      operationId: markMyNotificationSeen
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: header
          name: X-Request-Id
          required: false
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: |
            Item is now in `seen` status (or remained in a terminal status —
            seen/acted_on/expired/cancelled — which are no-ops; the call is
            idempotent regardless of whether a transition actually occurred).
        "401":
          description: Missing or invalid bearer token
        "404":
          description: |
            Item not found OR not owned by the authenticated user. We do not
            distinguish to avoid leaking the existence of other users' items.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SanctumPersonalAccessToken
