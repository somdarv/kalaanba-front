event_name: season.cutoff_passed
schema_version: 1
engine: season
description: |
  Emitted once when a configured cutoff inside the season is crossed —
  participation cutoff, new ranked challenge cutoff, ranked acceptance
  cutoff. Other engines react to halt or finalise flows.
required:
  - season_id
  - season_code
  - cutoff_key
  - cutoff_at
payload:
  season_id:
    type: uuid
  season_code:
    type: string
    pattern: "^\\d{4}/\\d{4}$"
  cutoff_key:
    type: string
    enum:
      - participation_cutoff_at
      - new_ranked_challenge_cutoff_at
      - ranked_acceptance_cutoff_at
  cutoff_at:
    type: string
    format: date-time
idempotency: |
  event_id is a deterministic UUIDv5 of `cutoff:{season_id}:{cutoff_key}`.
