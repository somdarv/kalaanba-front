event_name: club.created
schema_version: 1
engine: club
description: |
  Emitted when a user creates a club and becomes its Owner (Club engine doc
  §5, §7). Consumed by Analytics (club growth), Notification (welcome / next
  steps), Fan Buzz / Discovery (a new club may surface locally), and Season
  (a new active club auto-joins the season per Club §8, handled downstream).

  **A consumer that puts this club in front of the public must read
  `verification_state` first.** An `professional`-tier club is created `pending`
  and is not yet entitled to the name it carries; surfacing it before an admin
  clears it is the exact impersonation this event's producer refuses at the
  door (ADR-0017). Analytics may count it. Discovery may not show it.
required:
  - club_id
  - name
  - club_type
  - tier
  - verification_state
  - city_hub_id
  - area_id
  - created_by_user_id
  - created_at
payload:
  club_id:
    type: uuid
  name:
    type: string
  club_type:
    type: string
    description: Stable internal key from the club.types config set.
  tier:
    type: string
    description: |
      Stable internal key from the club.tiers config set (local | official).
      Added 2026-08-23; additive, so schema_version stays 1 (Constitution §8).
  verification_state:
    type: string
    description: |
      not_required (local) | pending (official, awaiting the document review
      in Club §10). Never `cleared` here: clearance is a later, separate event.
      Added 2026-08-23; additive.
  city_hub_id:
    type: uuid
    description: Zone-engine City Hub (cross-engine reference).
  area_id:
    type: uuid
    description: Zone-engine Area (cross-engine reference).
  created_by_user_id:
    type: uuid
    description: Identity account that created the club and owns it.
  created_at:
    type: string
    format: date-time
idempotency: |
  event_id is the club_id, so a retried creation cannot double-emit
  (Constitution §1.14). Creation is guarded by the Idempotency-Key middleware.
